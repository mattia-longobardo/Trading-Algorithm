# Default di configurazione. Precedenza a runtime: app_settings (DB) > questo file > env.
# Le chiavi API vivono SOLO nelle credenziali cifrate (UI), mai qui.
timezone: Europe/Rome      # solo presentazione: orari mostrati in questo fuso
currency: USD              # valuta di visualizzazione; i dati restano in USD
risk_free_rate_pct: 5.0    # T-bill 3M, usato da Sharpe/Sortino
benchmark_symbol: SPY

# Arena evolutiva: due agenti LLM rivali in day trading simulato; a fine mese
# sopravvive solo chi è in profitto e davanti al rivale. Lo stato runtime
# (mese, pausa, live) vive in app_settings sotto la chiave "arena".
arena:
  starting_capital_eur: 10000   # budget mensile di ogni agente (convertito in USD)
  cycle_minutes: 60             # un ciclo di decisioni ogni ora di borsa
  max_symbols: 80               # titoli mostrati ai trader per ciclo
  # Sessioni di borsa (UTC, orari estivi). Ogni sessione ha il suo EOD:
  # day trading per mercato, niente posizioni oltre la campanella.
  markets:
    europe:
      open_utc: "07:00"         # 09:00 CEST (Milano/Xetra/Parigi/Amsterdam/Londra)
      close_utc: "15:30"
    usa:
      open_utc: "13:30"         # NYSE 9:30 ET
      close_utc: "20:00"

