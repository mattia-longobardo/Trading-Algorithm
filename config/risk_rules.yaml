# Freni operativi del trading LIVE. La gestione del rischio "di analisi"
# (size, stop loss, take profit, numero posizioni) vive nel DNA degli agenti
# e si evolve con la selezione mensile; qui restano solo i freni d'emergenza.
circuit_breaker:
  max_daily_loss_pct: 2.0        # perdita giornaliera oltre cui si bloccano le aperture
  max_consecutive_losses: 4
  cooloff_hours: 24
