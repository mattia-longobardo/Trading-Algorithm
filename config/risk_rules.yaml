# Freni di SOPRAVVIVENZA del trading LIVE. Non moderano l'aggressività: esistono
# solo per impedire l'azzeramento del conto. Tutta la gestione operativa (size,
# stop loss, take profit, numero di posizioni, direzione, orizzonte) vive nel DNA
# degli agenti e si evolve con la selezione mensile.
circuit_breaker:
  max_daily_loss_pct: 25.0       # drawdown giornaliero da bancarotta: sotto si bloccano le APERTURE (mai le chiusure)
  max_consecutive_losses: 0      # 0 = disattivato: una serie di stop non minaccia la sopravvivenza
  cooloff_hours: 1               # pausa breve: il bot deve tornare a operare
