services:

# Trading App (Backend FastAPI + Frontend Next.js Unificato) # -------------------------------------------------------------------

  trading:
    build: .
    image: trading:latest
    container_name: trading
    user: "1000:1000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${DB_TRADING_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ARANGO_URL: http://arangodb:8529
      ARANGO_DB: trading
      ARANGO_USER: root
      ARANGO_PASSWORD: ${DB_ARANGO_PASSWORD}
      CONFIG_DIR: /app/config
      KILL_SWITCH_DIR: /app/state
      KNOWLEDGE_BASE_DIR: /app/knowledge_base
      FASTEMBED_CACHE_DIR: /app/state/fastembed_cache
      HF_HOME: /app/state/huggingface
      XDG_CACHE_HOME: /app/state/.cache
      STATE_DIR: /app/state
      TRADING_CREDENTIALS_SECRET: ${TRADING_CREDENTIALS_SECRET:-${AUTH_SECRET}}
      AUTH_SECRET: ${AUTH_SECRET}
      TRADING_INTERNAL_TOKEN: ${TRADING_INTERNAL_TOKEN}
      BACKEND_URL: http://127.0.0.1:8000
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://${TRADING_HOST}
      AUTH_AUTHENTIK_ID: ${AUTH_AUTHENTIK_ID}
      AUTH_AUTHENTIK_SECRET: ${AUTH_AUTHENTIK_SECRET}
      AUTH_AUTHENTIK_ISSUER: https://${AUTHENTIK_HOST}/application/o/trading/
      TZ: ${TZ}
    volumes:
      - ./config:/app/config:ro
      - ./state:/app/state
      - ./knowledge_base:/app/knowledge_base
    restart: unless-stopped
    init: true
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy_public"
      - "traefik.http.routers.trading-router.rule=Host(`${TRADING_HOST}`)"
      - "traefik.http.routers.trading-router.entrypoints=web"
      - "traefik.http.services.trading-service.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.trading-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.routers.trading-router.middlewares=trading-https"
    networks:
      - proxy_public
      - db_internal

networks:
  proxy_public:
    external: true
  db_internal:
    external: true
